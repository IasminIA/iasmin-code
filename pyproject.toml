[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iasmin-code"
version = "0.1.0"
description = "iasmin terminal CLI — Claude-Code-faithful local runner with remote brain on the Pi"
requires-python = ">=3.11"
dependencies = [
    "iasmin-core==0.1.0",
]

[project.scripts]
iasmin = "iasmin_cli.onetoshot:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
]

[[tool.uv.index]]
name = "pypiserver"
url = "https://pypi.iasmin.eu/simple/"
explicit = true

[tool.uv.sources]
iasmin-core = { index = "pypiserver" }

[tool.pytest.ini_options]
testpaths = ["tests"]
