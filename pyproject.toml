[project]
name = "iasmin-code"
version = "0.1.0"
description = "iasmin terminal CLI — Claude-Code-faithful local runner with remote brain on the Pi"
requires-python = ">=3.11"
dependencies = [
    "iasmin-core @ git+https://x-access-token:${IASMIN_CORE_GH_PAT}@github.com/IasminIA/iasmin-core.git@v0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
